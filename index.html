<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floorplan Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <div id="toolbar">
      <div class="toolbar-group">
        <span class="toolbar-label">Tools</span>
        <button class="tool-btn active" data-tool="select" title="Select (V)">
          <svg viewBox="0 -960 960 960"><path d="m320-410 79-110h170L320-716v306ZM551-80 406-392 240-160v-720l560 440H516l144 309-109 51ZM399-520Z" fill="currentColor"/></svg>
        </button>
        <button class="tool-btn" data-tool="pan" title="Pan (H)">
          <svg viewBox="0 -960 960 960"><path d="M402-40q-30 0-56-13.5T303-92L48-465l24-23q19-19 45-22t47 12l116 81v-383q0-17 11.5-28.5T320-840q17 0 28.5 11.5T360-800v537L212-367l157 229q5 8 14 13t19 5h278q33 0 56.5-23.5T760-200v-560q0-17 11.5-28.5T800-800q17 0 28.5 11.5T840-760v560q0 66-47 113T680-40H402Zm38-440v-400q0-17 11.5-28.5T480-920q17 0 28.5 11.5T520-880v400h-80Zm160 0v-360q0-17 11.5-28.5T640-880q17 0 28.5 11.5T680-840v360h-80ZM486-300Z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">Draw</span>
        <button class="tool-btn" data-tool="line" title="Line (L)">
          <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Rectangle (R)">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
        </button>
        <button class="tool-btn" data-tool="polygon" title="Polygon (P)">
          <svg viewBox="0 -960 960 960"><path d="M298-200h364l123-369-305-213-305 213 123 369Zm-58 80L80-600l400-280 400 280-160 480H240Zm240-371Z" fill="currentColor"/></svg>
        </button>
        <button class="tool-btn" data-tool="wall" title="Wall (W) — click to add points, double-click or right-click to finish">
          <svg viewBox="0 0 24 24"><rect x="2" y="8.5" width="20" height="7" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="Circle (C)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Text (T)">
          <svg viewBox="0 -960 960 960"><path d="M280-160v-520H80v-120h520v120H400v520H280Zm360 0v-320H520v-120h360v120H760v320H640Z" fill="currentColor"/></svg>
        </button>
        <button class="tool-btn" data-tool="sym" title="Place Symbol (M)">
          <svg viewBox="0 -960 960 960"><path d="m260-520 220-360 220 360H260ZM700-80q-75 0-127.5-52.5T520-260q0-75 52.5-127.5T700-440q75 0 127.5 52.5T880-260q0 75-52.5 127.5T700-80Zm-580-20v-320h320v320H120Zm580-60q42 0 71-29t29-71q0-42-29-71t-71-29q-42 0-71 29t-29 71q0 42 29 71t71 29Zm-500-20h160v-160H200v160Zm202-420h156l-78-126-78 126Zm78 0ZM360-340Zm340 80Z" fill="currentColor"/></svg>
        </button>
        <button class="tool-btn" data-tool="stairs" title="Stairs (S)">
          <svg viewBox="0 -960 960 960"><path d="M240-240h177v-133h103v-133h103v-134h97v-80H543v133H440v133H337v134h-97v80Zm-40 120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">Edit</span>
        <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
          <svg viewBox="0 -960 960 960"><path d="M690-240h190v80H610l80-80Zm-500 80-85-85q-23-23-23.5-57t22.5-58l440-456q23-24 56.5-24t56.5 23l199 199q23 23 23 57t-23 57L520-160H190Zm296-80 314-322-198-198-442 456 64 64h262Zm-6-240Z" fill="currentColor"/></svg>
        </button>
        <button id="undoBtn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 -960 960 960"><path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z" fill="currentColor"/></svg>
        </button>
        <button id="redoBtn" title="Redo (Ctrl+Y)">
          <svg viewBox="0 -960 960 960"><path d="M396-200q-97 0-166.5-63T160-420q0-94 69.5-157T396-640h252L544-744l56-56 200 200-200 200-56-56 104-104H396q-63 0-109.5 40T240-420q0 60 46.5 100T396-280h284v80H396Z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">Snap</span>
        <button id="gridToggle" class="active" title="Toggle Grid">
          <svg viewBox="0 -960 960 960"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h133v-133H200v133Zm213 0h134v-133H413v133Zm214 0h133v-133H627v133ZM200-413h133v-134H200v134Zm213 0h134v-134H413v134Zm214 0h133v-134H627v134ZM200-627h133v-133H200v133Zm213 0h134v-133H413v133Zm214 0h133v-133H627v133Z" fill="currentColor"/></svg>
        </button>
        <button id="snapToggle" class="active" title="Snap to Grid">
          <svg viewBox="0 -960 960 960"><path d="M440-280h80v-160h160v-80H520v-160h-80v160H280v80h160v160Zm40 200q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" fill="currentColor"/></svg>
        </button>
        <button id="snapShapeToggle" class="active" title="Snap to Shapes">
          <svg viewBox="0 -960 960 960"><path d="M640-280q83 0 141.5-58.5T840-480q0-83-58.5-141.5T640-680q-27 0-52.5 7T540-653q29 36 44.5 80t15.5 93q0 49-15.5 93T540-307q22 13 47.5 20t52.5 7Zm-160-80q19-25 29.5-55.5T520-480q0-34-10.5-64.5T480-600q-19 25-29.5 55.5T440-480q0 34 10.5 64.5T480-360Zm-160 80q27 0 52.5-7t47.5-20q-29-36-44.5-80T360-480q0-49 15.5-93t44.5-80q-22-13-47.5-20t-52.5-7q-83 0-141.5 58.5T120-480q0 83 58.5 141.5T320-280Zm0 80q-117 0-198.5-81.5T40-480q0-117 81.5-198.5T320-760q45 0 85.5 13t74.5 37q34-24 74.5-37t85.5-13q117 0 198.5 81.5T920-480q0 117-81.5 198.5T640-200q-45 0-85.5-13T480-250q-34 24-74.5 37T320-200Z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="toolbar-group toolbar-right">
        <span id="autosaveStatus" class="autosave-status" title="Autosaves to this browser as you work">Saved</span>
        <span class="toolbar-label">File</span>
        <button id="newBtn" title="New Floorplan (clears autosave)">
          <svg viewBox="0 -960 960 960"><path d="M440-240h80v-120h120v-80H520v-120h-80v120H320v80h120v120ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z" fill="currentColor"/></svg>
        </button>
        <button id="saveBtn" title="Save (Ctrl+S)">
          <svg viewBox="0 -960 960 960"><path d="M840-680v480q0 33-23.5 56.5T760-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h480l160 160Zm-80 34L646-760H200v560h560v-446ZM565-275q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35ZM240-560h360v-160H240v160Zm-40-86v446-560 114Z" fill="currentColor"/></svg>
        </button>
        <button id="loadBtn" title="Load">
          <svg viewBox="0 -960 960 960"><path d="M440-200h80v-167l64 64 56-57-160-160-160 160 57 56 63-63v167ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z" fill="currentColor"/></svg>
        </button>
        <button id="exportBtn" title="Export PNG">
          <svg viewBox="0 -960 960 960"><path d="M480-480ZM202-65l-56-57 118-118h-90v-80h226v226h-80v-89L202-65Zm278-15v-80h240v-440H520v-200H240v400h-80v-400q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H480Z" fill="currentColor"/></svg>
        </button>
        <input type="file" id="loadInput" accept=".json" style="display:none">
      </div>
    </div>

    <!-- Autosave restore notice -->
    <div id="autosave-toast" class="autosave-toast" style="display:none">
      <span>Restored your last session from this browser's autosave.</span>
      <button id="toastDismiss">Dismiss</button>
    </div>

    <!-- Main area -->
    <div id="main">
      <!-- Canvas area -->
      <div id="canvas-container">
        <canvas id="gridCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <div id="zoom-indicator">100%</div>
        <div id="coords-indicator">0, 0</div>
      </div>

      <!-- Properties + Layers panel -->
      <div id="sidebar">
        <!-- Scale & Measurements -->
        <div class="panel" id="scale-panel">
          <div class="panel-header">
            <div class="panel-header-left">
              <button class="panel-collapse-btn" title="Collapse"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg></button>
              <span>Scale</span>
            </div>
            <label class="checkbox-label" style="font-size:11px;gap:5px">
              <input type="checkbox" id="showMeasurements" checked>
              <span>Measurements</span>
            </label>
          </div>
          <div class="panel-body">
            <div class="prop-row">
              <label>1 grid =</label>
              <input type="number" id="scaleValue" min="0.01" max="10000" step="0.25" value="1">
              <select id="scaleUnit">
                <option value="ft">ft</option>
                <option value="in">in</option>
                <option value="m">m</option>
                <option value="cm">cm</option>
                <option value="mm">mm</option>
              </select>
            </div>
            <div class="scale-hint" id="scaleHint">1 grid cell = 1 ft</div>
            <div class="prop-row">
              <label>Snap to</label>
              <select id="snapDivisions">
                <option value="1">Whole cell</option>
                <option value="2">Half cell</option>
                <option value="4">Quarter cell</option>
                <option value="8">Eighth cell</option>
                <option value="16">1/16 cell</option>
              </select>
            </div>
            <div class="scale-hint" id="snapHint">Snap increment: 1 ft</div>
          </div>
        </div>

        <!-- Properties -->
        <div class="panel" id="properties-panel">
          <div class="panel-header">
            <div class="panel-header-left">
              <button class="panel-collapse-btn" title="Collapse"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg></button>
              <span>Properties</span>
            </div>
          </div>
          <div class="panel-body">
            <div class="prop-row">
              <label>Stroke</label>
              <input type="color" id="propStroke" value="#e8eaf2">
              <input type="number" id="propStrokeWidth" min="0.5" max="20" step="0.5" value="2" title="Stroke width">
            </div>
            <div class="prop-row">
              <label>Fill</label>
              <input type="color" id="propFill" value="#ffffff">
              <label class="checkbox-label">
                <input type="checkbox" id="propFillEnabled"> enable
              </label>
            </div>
            <div class="prop-row">
              <label>Style</label>
              <select id="propDash">
                <option value="solid">Solid</option>
                <option value="dashed">Dashed</option>
                <option value="dotted">Dotted</option>
              </select>
            </div>
            <div class="prop-row" id="textPropRow" style="display:none">
              <label>Font</label>
              <input type="number" id="propFontSize" min="8" max="72" value="14" title="Font size">
              <span>px</span>
            </div>
            <div class="prop-row" id="stairsPropRow" style="display:none">
              <label>Direction</label>
              <button id="stairsDirBtn" class="dir-toggle-btn" title="Toggle stairs direction"><svg viewBox="0 -960 960 960" width="14" height="14"><path d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z" fill="currentColor"/></svg><span id="stairsDirLabel">UP</span></button>
            </div>
            <div class="prop-row" id="wallPropRow" style="display:none">
              <label>Thickness</label>
              <input type="number" id="wallThickness" min="0.5" max="100000" step="0.5" value="12" title="Wall thickness (world units)">
              <span id="wallThicknessHint" class="sym-size-hint"></span>
            </div>
            <div id="selectionProps" style="display:none">
              <hr>
              <div class="prop-row">
                <label>Selection</label>
                <button id="deleteSelBtn" class="danger-btn">Delete</button>
              </div>
              <div class="prop-row">
                <label>Move to</label>
                <select id="moveToLayer"></select>
              </div>
            </div>
          </div>
        </div>

        <!-- Symbol Library -->
        <div class="panel" id="symbols-panel">
          <div class="panel-header">
            <div class="panel-header-left">
              <button class="panel-collapse-btn" title="Collapse"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg></button>
              <span>Symbols</span>
            </div>
            <div class="sym-controls">
              <label class="sym-ctrl-label">Size</label>
              <input type="number" id="symSize" min="0.5" max="100000" step="1" value="40" title="Symbol size (world units)">
              <span id="symSizeHint" class="sym-size-hint"></span>
              <button id="symRotateBtn" title="Rotate 90° (R key)"><svg viewBox="0 -960 960 960" width="14" height="14"><path d="M522-80v-82q34-5 66.5-18t61.5-34l56 58q-42 32-88 51.5T522-80Zm-80 0Q304-98 213-199.5T122-438q0-75 28.5-140.5t77-114q48.5-48.5 114-77T482-798h6l-62-62 56-58 160 160-160 160-56-56 64-64h-8q-117 0-198.5 81.5T202-438q0 104 68 182.5T442-162v82Zm322-134-58-56q21-29 34-61.5t18-66.5h82q-5 50-24.5 96T764-214Zm76-264h-82q-5-34-18-66.5T706-606l58-56q32 39 51 86t25 98Z" fill="currentColor"/></svg><span id="symRotLabel">0°</span></button>
            </div>
          </div>
          <div id="symbols-content"></div>
        </div>

        <!-- Layers -->
        <div class="panel" id="layers-panel">
          <div class="panel-header">
            <div class="panel-header-left">
              <button class="panel-collapse-btn" title="Collapse"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg></button>
              <span>Layers</span>
            </div>
            <button id="addLayerBtn" title="Add Layer">+</button>
          </div>
          <div class="layers-hint">Only the highlighted layer is editable — click a layer to switch to it.</div>
          <div id="layers-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Text input overlay -->
  <textarea id="textInput" style="display:none" placeholder="Type and press Enter"></textarea>

  <!-- Measurement label edit overlay -->
  <div id="measureEditWrap" style="display:none">
    <input type="text" id="measureEditInput" placeholder="e.g. 2ft 8in">
    <span id="measureEditUnit"></span>
  </div>

  <!-- General-purpose modal: prompt / confirm / alert. Native
       confirm()/alert()/prompt() are unreliable here — a published
       Artifact runs in a sandboxed iframe without allow-modals, where
       confirm() silently returns false with no dialog and no error. -->
  <div id="modal-overlay" style="display:none">
    <div id="modal">
      <div id="modal-title">New Layer</div>
      <div id="modal-message" style="display:none"></div>
      <input type="text" id="modal-input" placeholder="Layer name">
      <div id="modal-btns">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Export fallback modal — shown alongside the automatic download when the
       page is embedded in an iframe (e.g. a preview), where a sandboxed frame
       can silently block programmatic and even direct-click downloads with
       no error at all. This gives a manual way to get the data out either
       way: a real download link, a copy/save-able preview, and a hint. -->
  <div id="export-modal-overlay" style="display:none">
    <div id="export-modal">
      <div id="export-modal-title">Export</div>
      <div id="export-modal-hint"></div>
      <div id="export-modal-body"></div>
      <div id="export-modal-btns">
        <button id="export-modal-copy" style="display:none">Copy to Clipboard</button>
        <a id="export-modal-download" download>Download File</a>
        <button id="export-modal-close">Close</button>
      </div>
    </div>
  </div>

  <script src="symbols.js"></script>
  <script src="app.js"></script>
</body>
</html>
