<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floorplan Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <div id="toolbar">
      <div class="toolbar-group">
        <span class="toolbar-label">Tools</span>
        <button class="tool-btn active" data-tool="select" title="Select (V)">
          <svg viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-4 7z" fill="currentColor"/></svg>
        </button>
        <button class="tool-btn" data-tool="pan" title="Pan (H)">
          <svg viewBox="0 0 24 24"><path d="M9 11V6a2 2 0 0 1 4 0v5m0 0V5a2 2 0 0 1 4 0v6m0 0v-3a2 2 0 0 1 4 0v5a8 8 0 0 1-8 8H9a8 8 0 0 1-8-8v-1a2 2 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">Draw</span>
        <button class="tool-btn" data-tool="line" title="Line (L)">
          <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Rectangle (R)">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
        </button>
        <button class="tool-btn" data-tool="polygon" title="Polygon (P)">
          <svg viewBox="0 0 24 24"><polyline points="4,18 8,6 14,14 19,8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool-btn" data-tool="wall" title="Wall (W) — click to add points, double-click or right-click to finish">
          <svg viewBox="0 0 24 24"><rect x="2" y="8.5" width="20" height="7" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="Circle (C)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Text (T)">
          <svg viewBox="0 0 24 24"><text x="4" y="18" font-size="16" font-weight="bold" fill="currentColor">T</text></svg>
        </button>
        <button class="tool-btn" data-tool="sym" title="Place Symbol (M)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><line x1="9" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2"/><line x1="12" y1="9" x2="12" y2="15" stroke="currentColor" stroke-width="2"/><line x1="8" y1="9" x2="10" y2="9" stroke="currentColor" stroke-width="2"/><line x1="8" y1="12" x2="11" y2="12" stroke="currentColor" stroke-width="2"/><line x1="8" y1="15" x2="10" y2="15" stroke="currentColor" stroke-width="2"/><line x1="13" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="2"/><line x1="16" y1="9" x2="13" y2="15" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="stairs" title="Stairs (S)">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><line x1="3" y1="8.5" x2="21" y2="8.5" stroke="currentColor" stroke-width="1.5"/><line x1="3" y1="13" x2="21" y2="13" stroke="currentColor" stroke-width="1.5"/><line x1="3" y1="17.5" x2="21" y2="17.5" stroke="currentColor" stroke-width="1.5"/><path d="M12 19V5m-3.5 4L12 5l3.5 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">Edit</span>
        <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
          <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16l11-11 6 6-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 17l-2-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="undoBtn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><circle cx="13" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="44 6.3" transform="rotate(40 13 13)"/><path d="M8 3 3 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="redoBtn" title="Redo (Ctrl+Y)">
          <svg viewBox="0 0 24 24"><g transform="translate(24,0) scale(-1,1)"><circle cx="13" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="44 6.3" transform="rotate(40 13 13)"/><path d="M8 3 3 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
        </button>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">Snap</span>
        <button id="gridToggle" class="active" title="Toggle Grid">
          <svg viewBox="0 0 24 24"><path d="M3 3h18M3 9h18M3 15h18M3 21h18M3 3v18M9 3v18M15 3v18M21 3v18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button id="snapToggle" class="active" title="Snap to Grid">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="19" cy="5" r="1.5" fill="currentColor"/><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/><circle cx="19" cy="19" r="1.5" fill="currentColor"/></svg>
        </button>
        <button id="snapShapeToggle" class="active" title="Snap to Shapes">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="17" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="11" y1="7" x2="14" y2="14" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2,2"/></svg>
        </button>
      </div>
      <div class="toolbar-group toolbar-right">
        <span id="autosaveStatus" class="autosave-status" title="Autosaves to this browser as you work">Saved</span>
        <span class="toolbar-label">File</span>
        <button id="newBtn" title="New Floorplan (clears autosave)">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="14,2 14,8 20,8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="12" x2="12" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="15" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="saveBtn" title="Save (Ctrl+S)">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="17,21 17,13 7,13 7,21" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="7,3 7,8 15,8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="loadBtn" title="Load">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="exportBtn" title="Export PNG">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="7,10 12,15 17,10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <input type="file" id="loadInput" accept=".json" style="display:none">
      </div>
    </div>

    <!-- Autosave restore notice -->
    <div id="autosave-toast" class="autosave-toast" style="display:none">
      <span>Restored your last session from this browser's autosave.</span>
      <button id="toastDismiss">Dismiss</button>
    </div>

    <!-- Main area -->
    <div id="main">
      <!-- Canvas area -->
      <div id="canvas-container">
        <canvas id="gridCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <div id="zoom-indicator">100%</div>
        <div id="coords-indicator">0, 0</div>
      </div>

      <!-- Properties + Layers panel -->
      <div id="sidebar">
        <!-- Scale & Measurements -->
        <div class="panel" id="scale-panel">
          <div class="panel-header">
            <div class="panel-header-left">
              <button class="panel-collapse-btn" title="Collapse"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg></button>
              <span>Scale</span>
            </div>
            <label class="checkbox-label" style="font-size:11px;gap:5px">
              <input type="checkbox" id="showMeasurements" checked>
              <span>Measurements</span>
            </label>
          </div>
          <div class="panel-body">
            <div class="prop-row">
              <label>1 grid =</label>
              <input type="number" id="scaleValue" min="0.01" max="10000" step="0.25" value="1">
              <select id="scaleUnit">
                <option value="ft">ft</option>
                <option value="in">in</option>
                <option value="m">m</option>
                <option value="cm">cm</option>
                <option value="mm">mm</option>
              </select>
            </div>
            <div class="scale-hint" id="scaleHint">1 grid cell = 1 ft</div>
            <div class="prop-row">
              <label>Snap to</label>
              <select id="snapDivisions">
                <option value="1">Whole cell</option>
                <option value="2">Half cell</option>
                <option value="4">Quarter cell</option>
                <option value="8">Eighth cell</option>
                <option value="16">1/16 cell</option>
              </select>
            </div>
            <div class="scale-hint" id="snapHint">Snap increment: 1 ft</div>
          </div>
        </div>

        <!-- Properties -->
        <div class="panel" id="properties-panel">
          <div class="panel-header">
            <div class="panel-header-left">
              <button class="panel-collapse-btn" title="Collapse"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg></button>
              <span>Properties</span>
            </div>
          </div>
          <div class="panel-body">
            <div class="prop-row">
              <label>Stroke</label>
              <input type="color" id="propStroke" value="#e8eaf2">
              <input type="number" id="propStrokeWidth" min="0.5" max="20" step="0.5" value="2" title="Stroke width">
            </div>
            <div class="prop-row">
              <label>Fill</label>
              <input type="color" id="propFill" value="#ffffff">
              <label class="checkbox-label">
                <input type="checkbox" id="propFillEnabled"> enable
              </label>
            </div>
            <div class="prop-row">
              <label>Style</label>
              <select id="propDash">
                <option value="solid">Solid</option>
                <option value="dashed">Dashed</option>
                <option value="dotted">Dotted</option>
              </select>
            </div>
            <div class="prop-row" id="textPropRow" style="display:none">
              <label>Font</label>
              <input type="number" id="propFontSize" min="8" max="72" value="14" title="Font size">
              <span>px</span>
            </div>
            <div class="prop-row" id="stairsPropRow" style="display:none">
              <label>Direction</label>
              <button id="stairsDirBtn" class="dir-toggle-btn">⇅ UP</button>
            </div>
            <div class="prop-row" id="wallPropRow" style="display:none">
              <label>Thickness</label>
              <input type="number" id="wallThickness" min="0.5" max="100000" step="0.5" value="12" title="Wall thickness (world units)">
              <span id="wallThicknessHint" class="sym-size-hint"></span>
            </div>
            <div id="selectionProps" style="display:none">
              <hr>
              <div class="prop-row">
                <label>Selection</label>
                <button id="deleteSelBtn" class="danger-btn">Delete</button>
              </div>
              <div class="prop-row">
                <label>Move to</label>
                <select id="moveToLayer"></select>
              </div>
            </div>
          </div>
        </div>

        <!-- Symbol Library -->
        <div class="panel" id="symbols-panel">
          <div class="panel-header">
            <div class="panel-header-left">
              <button class="panel-collapse-btn" title="Collapse"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg></button>
              <span>Symbols</span>
            </div>
            <div class="sym-controls">
              <label class="sym-ctrl-label">Size</label>
              <input type="number" id="symSize" min="0.5" max="100000" step="1" value="40" title="Symbol size (world units)">
              <span id="symSizeHint" class="sym-size-hint"></span>
              <button id="symRotateBtn" title="Rotate 90° (R key)">↻ <span id="symRotLabel">0°</span></button>
            </div>
          </div>
          <div id="symbols-content"></div>
        </div>

        <!-- Layers -->
        <div class="panel" id="layers-panel">
          <div class="panel-header">
            <div class="panel-header-left">
              <button class="panel-collapse-btn" title="Collapse"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg></button>
              <span>Layers</span>
            </div>
            <button id="addLayerBtn" title="Add Layer">+</button>
          </div>
          <div class="layers-hint">Only the highlighted layer is editable — click a layer to switch to it.</div>
          <div id="layers-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Text input overlay -->
  <textarea id="textInput" style="display:none" placeholder="Type and press Enter"></textarea>

  <!-- Measurement label edit overlay -->
  <div id="measureEditWrap" style="display:none">
    <input type="text" id="measureEditInput" placeholder="e.g. 2ft 8in">
    <span id="measureEditUnit"></span>
  </div>

  <!-- General-purpose modal: prompt / confirm / alert. Native
       confirm()/alert()/prompt() are unreliable here — a published
       Artifact runs in a sandboxed iframe without allow-modals, where
       confirm() silently returns false with no dialog and no error. -->
  <div id="modal-overlay" style="display:none">
    <div id="modal">
      <div id="modal-title">New Layer</div>
      <div id="modal-message" style="display:none"></div>
      <input type="text" id="modal-input" placeholder="Layer name">
      <div id="modal-btns">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Export fallback modal — shown alongside the automatic download when the
       page is embedded in an iframe (e.g. a preview), where a sandboxed frame
       can silently block programmatic and even direct-click downloads with
       no error at all. This gives a manual way to get the data out either
       way: a real download link, a copy/save-able preview, and a hint. -->
  <div id="export-modal-overlay" style="display:none">
    <div id="export-modal">
      <div id="export-modal-title">Export</div>
      <div id="export-modal-hint"></div>
      <div id="export-modal-body"></div>
      <div id="export-modal-btns">
        <button id="export-modal-copy" style="display:none">Copy to Clipboard</button>
        <a id="export-modal-download" download>Download File</a>
        <button id="export-modal-close">Close</button>
      </div>
    </div>
  </div>

  <script src="symbols.js"></script>
  <script src="app.js"></script>
</body>
</html>
